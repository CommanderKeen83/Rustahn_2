[package]
name = "rustahn"
version = "0.1.0"
edition = "2024"

[dependencies]
sola-raylib = "6.0"

[profile.release]
opt-level = 3

# Forces an optimized (Release) raylib build for 60 FPS performance.
# Note: On Linux/Mesa drivers, raylib's LoadRenderTexture under release optimizations
# fails to properly allocate texture storage (GCC -O3 miscompilation of rlLoadTexture(NULL))
# and depth attachments. This is detected and automatically recovered in Window::init.
[profile.release.build-override]
opt-level = 3
debug-assertions = false